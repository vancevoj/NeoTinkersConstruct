/*
 * Tinkers Construct - NeoForge 1.21.1 port build file
 * Original ForgeGradle build by boni, Sunstrike, ProgWML6 (Slime Knights).
 * Converted to ModDevGradle for NeoForge 1.21.1.
 */

plugins {
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'io.freefair.lombok' version '8.10'
}

group = 'slimeknights.tconstruct'
// version = <mc>-<upstream Tinkers version>-v<fork version>, e.g. 1.21.1-3.11.2-v1.0
version = "${minecraft_version}-${mod_version}-v${fork_version}"
base {
    archivesName = 'NeoTinkers'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}, Version: ${version}"

repositories {
    mavenCentral()
    maven { name = 'BlameJared (JEI, Immersive Engineering, CraftTweaker)'; url = 'https://maven.blamejared.com' }
    maven { name = 'Dogforce Games (JSON Things)'; url = 'https://www.dogforce-games.com/maven/' }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll(
                '--mod', 'tconstruct',
                '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath,
                '--existing-mod', 'mantle'
            )
        }
    }

    mods {
        tconstruct {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
    // debug resources help develop the mod, they are not shipped
    exclude 'assets/tconstruct/debug'
}

// TEMPORARY: integrations whose 3rd-party APIs are not yet available for 1.21.1
// (their compileOnly deps below are commented out). Excluded so the core mod builds;
// re-enable each source tree when its dependency is restored in `dependencies`.
//  - jei: recipe viewer (mezz.jei)
//  - jsonthings: dev.gigaherz.jsonthings
//  - ImmersiveEngineeringPlugin: blusunrize.immersiveengineering
//  - craftingtweaks: net.blay09.mods.craftingtweaks
//  - DietPlugin: com.illusivesoulworks.diet
//  - DummmmmmyPlugin: net.mehvahdjukaar.dummmmmmy
sourceSets.main.java {
    exclude 'slimeknights/tconstruct/plugin/jei/**'
    exclude 'slimeknights/tconstruct/plugin/jsonthings/**'
    exclude 'slimeknights/tconstruct/plugin/craftingtweaks/**'
    exclude 'slimeknights/tconstruct/plugin/ImmersiveEngineeringPlugin.java'
    exclude 'slimeknights/tconstruct/plugin/DietPlugin.java'
    exclude 'slimeknights/tconstruct/plugin/DummmmmmyPlugin.java'
}

dependencies {
    // Mantle: substituted by the ../Mantle composite build (see settings.gradle).
    implementation "slimeknights.mantle:Mantle:${minecraft_version}-${mantle_version}"

    // --- Optional integrations. Re-enable each as its integration package is ported. ---
    // JEI (recipe viewer)
    // compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // JSON Things
    // compileOnly "dev.gigaherz.jsonthings:JsonThings-${minecraft_version}:${json_things_version}"
    // Immersive Engineering
    // compileOnly "blusunrize.immersiveengineering:ImmersiveEngineering:${minecraft_version}-${ie_version}"

    // Unit tests
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

test {
    useJUnitPlatform()
}

// The src/test sources are a deferred part of the 1.21.1/NeoForge port: they still use 1.20.1/Forge APIs
// (net.minecraftforge.*) and the ModDevGradle test source set is not yet wired to the Minecraft/NeoForge
// classpath. Disable test compilation/execution so the main mod still builds its jar. Re-enable when porting tests.
tasks.named('compileTestJava').configure { enabled = false }
tasks.named('test').configure { enabled = false }

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        version          : version,
        mod_version      : mod_version,
        fork_version     : fork_version,
        loader_range     : loader_range,
        minecraft_range  : minecraft_range,
        neoforge_range   : neoforge_range,
        mantle_range     : mantle_range,
        jei_range        : jei_range,
        json_things_range: json_things_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : "Tinkers' Construct",
                "Specification-Vendor"    : "Slime Knights",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "Slime Knights"
        ])
    }
}

sourcesJar {
    exclude 'assets/**'
    exclude 'data/**'
    exclude 'pack.png'
    exclude 'pack.mcmeta'
    exclude 'META-INF/neoforge.mods.toml'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        if (project.hasProperty('DEPLOY_DIR')) {
            maven { url DEPLOY_DIR }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
