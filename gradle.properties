# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# NeoForm decompiles Minecraft on first run and needs headroom.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# NeoForge 1.21.1 port; mod_version tracks the upstream TConstruct version it derives from.
mod_version=3.11.2
# fork_version is THIS fork's release number; bump it every published release (1.0 -> 1.1 -> 1.2 ...).
# Final version string and jar name = <minecraft_version>-<mod_version>-v<fork_version>.
# 1.25: FULL release. Fixes a data-loss bug where a single unparseable stored item wiped an ENTIRE Tinkers' chest
# on load (any throw in readInventory propagated out of loadAdditional, and vanilla's BlockEntity.loadStatic discards
# the whole block entity on a load throw, so the chest reloaded empty). readInventory now parses each slot
# independently, logging and skipping only the bad stack and keeping every item that still loads. Promotes the
# v1.22-v1.24 dev line: smeltery fuel/temperature fixes, slime hitboxes, EMI rendering, Luck/Fortune drops, blazing blood.
# 1.26: three fixes. (a) EMI "+" recipe transfer for the Crafting Station: registered a StandardRecipeHandler +
# vanilla-crafting workstation (EMI had NO handler for the menu, so it said "workstation does not support recipe";
# JEI already worked). (b) Crossbow loaded model (#13): the tconstruct:ammo item property read minecraft:custom_data,
# but tools store NBT in the tconstruct:tool_data component, so it was always 0 and the charged model never rendered;
# now reads ToolDataComponents.getTag like the other properties. (c) Smeltery/Foundry fuel gauge blank on reopen (#7
# regression): clearFluidListeners() called resetHandler(null) which also wiped lastPos (the tank position the GUI
# renders from), and routine structure re-checks kept clearing it; now clears only the active handler (clearLastListener),
# and getFuelInfo() falls back to the first tank actually holding fuel instead of blindly the first structural tank.
fork_version=1.26

# Minecraft Version Information
minecraft_base_version=1.21
minecraft_version=1.21.1
minecraft_range=[1.21.1,1.21.2)

# NeoForge Version Information
# loader_range tracks the FML version, not the NeoForge version.
loader_range=[4,)
neoforge_version=21.1.233
neoforge_range=[21.1.0,)

# Parchment mappings for 1.21.1
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Mantle dependency: built from the sibling vancevoj/Mantle 1.21 port via composite build (see settings.gradle).
mantle_version=1.21.0
mantle_range=[1.21.0,)

# Optional compat (NeoForge 1.21.1 coordinates; wire in as each integration package is ported)
jei_version=19.21.0.247
jei_range=[19.21.0,)
json_things_version=0.10.2
json_things_range=[0.10.0,)
ie_version=12.4.0-180
# EMI (recipe viewer) for 1.21.1 NeoForge, from the TerraformersMC maven
emi_version=1.1.24+1.21.1
emi_range=[1.1.0,)
